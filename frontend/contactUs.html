<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | RideLink</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <div class="container">
    <nav>
      <div class="logo">
        <a href="index.html">
          <img src="RideLink.png" alt="RideLink logo" />
        </a>
      </div>
      <div class="nav-links">
        <a href="post.html">Post a trip</a>
        <a href="ride.html">Find a Ride</a>
        <a href="#My Trips">My Trips</a>
        <a href="info.html">How It Works</a>
        <a href="contactUs.html">Contact Us</a>

        <div class="dropdown">
          <a class="dropdown-toggle">My Account ▾</a>
          <div class="dropdown-menu">
            <a href="#login">Log In</a>
            <a href="#settings">Settings</a>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>

<section class="form-section">
  <div class="form-container">

    <!-- LEFT: Contact Form -->
    <div class="form-card">
      <h1>Contact Us</h1>
      <h2>Feedback</h2>
      <p>Let us know how your trip was.</p>

      <form>
        <div class="field">
          <input type="text" id="feedback" placeholder=" " required>
          <label for="feedback">Your Feedback</label>
        </div>

        <button class="btn-primary" type="submit">Submit</button>
      </form>

      <div style="margin-top: 2rem;">
        <h3>Questions or concerns?</h3>
        <p><strong>Call:</strong> 000-000-0000</p>
        <p><strong>Email:</strong> email.com</p>
      </div>
    </div>

    <!-- RIGHT: Image -->
    <div class="form-image-stack">
      <div class="form-image">
        <img src="Ridelink (1).png" alt="Contact illustration">
      </div>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 RideLink. Built for students.</p>
</footer>

</body>
</html>
