<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideLink — Campus Ridesharing</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <a href="index.html">
            <img src="RideLink.png" alt="RideLink logo" />
          </a>
        </div>
        <div class="nav-links">
          <a href="post.html">Post a trip</a>
          <a href="ride.html">Find a Ride</a>
          <a href="#My Trips">My Trips</a>
          <a href="info.html">How It Works</a>
          <a href="#account">My Account</a>
          <div class="dropdown">
            <a class="dropdown-toggle">My Account ▾</a>
            <div class="dropdown-menu">
              <a href="/login">Log In</a>
            </div>
          </div>
          <a href="contactUs.html">Contact Us</a>

          <div class="dropdown">
            <a class="dropdown-toggle">My Account ▾</a>
            <div class="dropdown-menu">
              <a href="#signup">Sign Up</a>
              <a href="settings.html">Settings</a>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <!-- AI GEN BELOW REMOVE IN PROD ⚠️⚠️⚠️ -->
  <section class="ride-search-section">
    <h1>Find a Ride(AI GEN PLACAEHOLDER)</h1>
    <div class="search-form">
      <input type="text" id="address" placeholder="Destination address" />
      <input type="datetime-local" id="date" />
      <button id="searchButton">Search</button>
    </div>
    <div id="results"></div>
  </section>

  <style>
    .ride-search-section {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .ride-search-section h1 {
      margin-bottom: 1rem;
    }
    .search-form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .search-form input {
      flex: 1;
      min-width: 180px;
      padding: 0.6rem 0.8rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .search-form button {
      padding: 0.6rem 1.4rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .search-form button:hover {
      opacity: 0.9;
    }
    .ride-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.75rem;
    }
    .ride-card-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .ride-arrow {
      color: var(--primary);
    }
    .ride-card-body {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .no-results {
      color: var(--muted);
      text-align: center;
      margin-top: 2rem;
    }
  </style>

  <script src="ride.js"></script>
  <!-- AI GEN ABOVE REMOVE IN PROD⚠️⚠️⚠️  -->
  <footer id="contact">
    <p>© 2026 RideLink. Built for students.</p>
  </footer>

</body>

</html>
