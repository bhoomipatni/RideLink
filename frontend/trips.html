<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideLink — My Trips</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <a href="index.html"><img src="RideLink.png" alt="RideLink logo" /></a>
        </div>
        <div class="nav-links">
          <a href="post.html">Post a trip</a>
          <a href="ride.html">Find a Ride</a>
          <a href="trips.html">My Trips</a>
          <a href="info.html">How It Works</a>
          <a href="#contact">Contact Us</a>
          <div class="dropdown">
            <a class="dropdown-toggle">My Account ▾</a>
            <div class="dropdown-menu">
              <a href="/login">Log In</a>
              <a href="#signup">Sign Up</a>
              <a href="#settings">Settings</a>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="detail-page">
      <h1 class="trips-heading">My Trips</h1>
      <div class="tab-bar">
        <button class="tab active" onclick="showTab('upcoming', event)">Upcoming</button>
        <button class="tab" onclick="showTab('past', event)">Past</button>
        <button class="tab" onclick="showTab('driver', event)">Driver</button>
      </div>
      <div id="trip-list"></div>
    </div>
  </main>

  <footer id="contact">
    <p>© 2026 RideLink. Built for students.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
