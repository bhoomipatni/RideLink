<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideLink — Campus Ridesharing</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="./post.js" defer></script>
</head>

<body>
  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <a href="index.html">
            <img src="RideLink.png" alt="RideLink logo" />
          </a>
        </div>
        <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" id="nav-links">
          <a href="post.html">Post a trip</a>
          <a href="ride.html">Find a Ride</a>
          <a href="trips.html">My Trips</a>
          <a href="info.html">How It Works</a>
          <a href="contactUs.html">Contact Us</a>
          <div class="dropdown" id="nav-dropdown">
            <a class="dropdown-toggle" onclick="toggleDropdown(event)">My Account ▾</a>
            <div class="dropdown-menu">
              <a href="/login">Log In</a>
              <a href="#signup">Sign Up</a>
              <a href="settings.html">Settings</a>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <section class="form-section">
    <div class="form-container">
      <div class="form-card">
        <h1>Post a Trip</h1>
        <h2>Trip Details</h2>
        <form>
          <div class="field">
            <input id="start" name="start" type="text" placeholder=" " required />
            <label for="start">Start Location</label>
          </div>
          <div class="field">
            <input id="end" name="end" type="text" placeholder=" " required />
            <label for="end">Destination</label>
          </div>
          <div class="field">
            <input id="date" name="date" type="date" placeholder=" " required />
            <label for="date">Leave Date</label>
          </div>
          <div class="field">
            <input id="time" name="time" type="time" placeholder=" " required />
            <label for="time">Choose a Time</label>
          </div>
          <div class="field">
            <input id="seats" name="seats" type="number" placeholder=" " required />
            <label for="seats">Number of Seats</label>
          </div>
          <button id="postButton" type="button">Post Trip</button>
        </form>
      </div>
      <div class="form-image-stack">
        
        <div class="form-image">
          <img src="Ridelink (1).png" alt="image">
        </div>
      </div>
    </div>
  </section>

  <footer id="contact">
    <p>© 2026 RideLink. Built for students.</p>
  </footer>
  <script src="./post.js"></script>
  <script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');
    hamburger.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', isOpen);
    });
    function toggleDropdown(e) {
      e.preventDefault();
      document.getElementById('nav-dropdown').classList.toggle('open');
    }
  </script>
</body>
</html>
