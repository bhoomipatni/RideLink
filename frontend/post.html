<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideLink — Campus Ridesharing</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="./post.js" defer></script>
</head>

<body>
  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <a href="index.html">
            <img src="RideLink.png" alt="RideLink logo" />
          </a>
        </div>
        <div class="nav-links">
          <a href="post.html">Post a trip</a>
          <a href="ride.html">Find a Ride</a>
          <a href="upcomingRides.html">Upcoming Rides</a>
          <a href="#My Trips">My Trips</a>
          <a href="info.html">How It Works</a>
          <a href="contactUs.html">Contact Us</a>

          <div class="dropdown">
            <a class="dropdown-toggle">My Account ▾</a>
            <div class="dropdown-menu">
              <a href="/login">Log In</a>
              <a href="#signup">Sign Up</a>
              <a href="settings.html">Settings</a>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <section class="form-section">
    <div class="form-container">
      <div class="form-card">
        <h1>Post a Trip</h1>
        <h2>Trip Details</h2>
        <form>
          <div class="field">
            <input id="start" name="start" type="text" placeholder=" " required />
            <label for="start">Start Location</label>
          </div>
          <div class="field">
            <input id="end" name="end" type="text" placeholder=" " required />
            <label for="end">Destination</label>
          </div>
          <div class="field">
            <input id="date" name="date" type="date" placeholder=" " required />
            <label for="date">Leave Date</label>
          </div>
          <div class="field">
            <input id="time" name="time" type="time" placeholder=" " required />
            <label for="time">Choose a Time</label>
          </div>
          <div class="field">
            <input id="seats" name="seats" type="number" placeholder=" " required />
            <label for="seats">Number of Seats</label>
          </div>
          <button id="postButton" type="button">Post Trip</button>
        </form>
      </div>
      <div class="form-image-stack">
        <div class="form-image">
          <img src="postAtripImage.webp" alt="image">
        </div>
        <div class="form-image">
          <img src="RideLink.png" alt="image">
        </div>
      </div>
    </div>
  </section>


  <footer id="contact">
    <p>© 2026 RideLink. Built for students.</p>
  </footer>

</body>

</html>
